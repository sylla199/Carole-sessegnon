<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:rgb(252,249,248)}
  a{color:rgb(71,29,27);text-decoration:none}
  a:hover{color:rgb(129,53,50)}
  input,select,textarea,button{font-family:var(--font-body);font-size:16px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:1px solid rgb(71,29,27);outline-offset:2px}
  @keyframes cs-spin{to{transform:rotate(360deg)}}
  @keyframes cs-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cs-slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .fx-dim{transition:opacity .15s cubic-bezier(.2,0,0,1)}
  .fx-dim:hover{opacity:.72}
  .fx-press{transition:transform .15s cubic-bezier(.2,0,0,1)}
  .fx-press:active{transform:scale(.96)}
  .fx-press99{transition:transform .15s cubic-bezier(.2,0,0,1)}
  .fx-press99:active{transform:scale(.99)}
  .fx-bordeaux{transition:background-color .15s cubic-bezier(.2,0,0,1)}
  .fx-bordeaux:hover{background:rgb(129,53,50)!important}
  .fx-reveal{--reveal:0}
  .fx-reveal:hover{--reveal:1}

  /* --- micro-animations (esprit posé : fondu, pas de rebond, pas de scale agressif) --- */
  @media (prefers-reduced-motion: no-preference){
    .reveal{opacity:0;transform:translateY(10px);transition:opacity .7s cubic-bezier(.2,0,0,1),transform .7s cubic-bezier(.2,0,0,1)}
    .reveal.in{opacity:1;transform:none}
    /* transition "style Apple" entre chaque section, sur toutes les pages : fondu + léger
       relèvement + très légère mise à l'échelle, posé, jamais de rebond */
    .sec-reveal{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .9s cubic-bezier(.2,0,0,1),transform .9s cubic-bezier(.2,0,0,1);will-change:opacity,transform}
    .sec-reveal.in{opacity:1;transform:none}
  }
  .ulink{position:relative}
  .ulink::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:currentColor;opacity:.3}
  .ulink::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,0,0,1)}
  .ulink:hover::after,.ulink:focus-visible::after{transform:scaleX(1)}
  .cs-menu-link{position:relative}
  .cs-menu-link::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,0,0,1)}
  .cs-menu-link:hover::after,.cs-menu-link:focus-visible::after{transform:scaleX(1)}
  .cs-grad-ulink{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:100% 1px;transition:background-size .3s ease-out}
  .cs-grad-ulink:hover,.cs-grad-ulink:focus-visible{background-size:0% 1px}
  .cs-cat-tab{position:relative;flex:0 0 auto;background:none;border:0;padding:0 0 14px;cursor:pointer;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:color .2s cubic-bezier(.2,0,0,1)}
  .cs-cat-tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,0,0,1)}
  .cs-cat-tab.is-active::after,.cs-cat-tab:hover::after,.cs-cat-tab:focus-visible::after{transform:scaleX(1)}
  .cs-cat-scroll{scrollbar-width:none}
  .cs-cat-scroll::-webkit-scrollbar{display:none}
  .cs-pdp-gallery{display:flex;flex-direction:column;gap:clamp(8px,1vw,14px)}
  .cs-pdp-shot{position:relative;flex:0 0 auto;aspect-ratio:4/5;overflow:hidden;cursor:zoom-in}
  .fx-nudgeL{transition:transform .18s cubic-bezier(.2,0,0,1)}
  .fx-nudgeL:active{transform:translateX(-3px)}
  .fx-arrowL{transform:translateY(-50%);transition:transform .18s cubic-bezier(.2,0,0,1)}
  .fx-arrowL:active{transform:translateY(-50%) translateX(-3px)}
  .fx-arrowR{transform:translateY(-50%);transition:transform .18s cubic-bezier(.2,0,0,1)}
  .fx-arrowR:active{transform:translateY(-50%) translateX(3px)}
  .fx-nudgeR{transition:transform .18s cubic-bezier(.2,0,0,1)}
  .fx-nudgeR:active{transform:translateX(3px)}
  @keyframes cs-pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .cs-badge-pulse{animation:cs-pulse .6s ease-in-out}
  .cs-door3d{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgb(252,249,248);padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0);overflow:hidden}
  .d3-scene{--d3-w:min(96vw,calc(94vh * 1218 / 2048));--d3-duree:2s;--d3-ease:cubic-bezier(.62,.04,.2,1);position:relative;width:var(--d3-w);aspect-ratio:1218/2048;perspective:calc(var(--d3-w) * 2.4);perspective-origin:50% 50%;transition:transform .5s cubic-bezier(.3,0,.2,1)}
  .d3-scene.d3-zoom{transform:scale(2.6)}
  .d3-fond{position:absolute;inset:0}
  .d3-fond svg,.d3-face svg{display:block;width:100%;height:100%}
  .d3-lueur{position:absolute;left:8.292%;top:10.645%;width:83.087%;height:79.492%;background:radial-gradient(ellipse 45% 55% at 50% 45%,#FCEFD4,#EFD9B3 60%,#CDB28B);z-index:1;opacity:0;transition:opacity .8s ease}
  .d3-ouvert .d3-lueur{opacity:1}
  .d3-passeport{position:absolute;left:8.292%;top:10.645%;width:83.087%;height:79.492%;background:rgb(252,249,248);box-shadow:inset 0 0 0 1px rgba(71,29,27,.2);display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;transform:translateZ(calc(var(--d3-w) * -.55));opacity:0;transition:transform var(--d3-duree) var(--d3-ease),opacity 1s ease calc(var(--d3-duree) * .22);z-index:3;overflow:hidden}
  .d3-passeport::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,rgba(71,29,27,.08),transparent 70%)}
  .d3-passeport>*{position:relative}
  .d3-marque{width:min(100%,300px);line-height:0;margin:6px 0}
  .d3-marque svg{display:block;width:100%;height:auto}
  .d3-intro{margin:0 0 2px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:rgba(71,29,27,.8)}
  .d3-passeport p{margin:0;font-size:14px;line-height:1.6;color:rgba(71,29,27,.8);max-width:26ch}
  .d3-ouvert .d3-passeport{transform:translateZ(0);opacity:1}
  .d3-ombre-baie{position:absolute;left:8.292%;top:10.645%;width:83.087%;height:79.492%;box-shadow:inset 0 26px 28px -14px rgba(0,0,0,.5),inset 14px 0 20px -12px rgba(0,0,0,.4),inset -14px 0 20px -12px rgba(0,0,0,.4);pointer-events:none;z-index:4}
  .d3-porte{position:absolute;top:10.645%;height:79.492%;width:41.543%;transform-style:preserve-3d;transition:transform var(--d3-duree) var(--d3-ease);z-index:5}
  .d3-gauche{left:8.292%;transform-origin:left center}
  .d3-droite{left:49.918%;transform-origin:right center}
  .d3-ouvert .d3-gauche{transform:rotateY(-104deg)}
  .d3-ouvert .d3-droite{transform:rotateY(104deg)}
  .d3-face{position:absolute;inset:0;backface-visibility:hidden}
  .d3-face::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity var(--d3-duree) var(--d3-ease)}
  .d3-ouvert .d3-face::after{opacity:.45}
  .d3-revers{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 30%,transparent 70%,rgba(0,0,0,.3)),#2a2018;transform:rotateY(180deg);backface-visibility:hidden}
  .d3-revers::before{content:"";position:absolute;inset:3% 6% 3% 6%;border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 0 0 9px rgba(0,0,0,.14),inset 0 0 0 10px rgba(255,255,255,.04)}
  .d3-tranche{position:absolute;top:0;bottom:0;width:calc(var(--d3-w) * .035);background:linear-gradient(90deg,#3a2e24,#75614d 50%,#3a2e24)}
  .d3-gauche .d3-tranche{right:0;transform-origin:right center;transform:rotateY(90deg) translateX(calc(var(--d3-w) * .0175))}
  .d3-droite .d3-tranche{left:0;transform-origin:left center;transform:rotateY(-90deg) translateX(calc(var(--d3-w) * -.0175))}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1 !important;transform:none !important}
    .sec-reveal{opacity:1 !important;transform:none !important}
    .cs-badge-pulse{animation:none}
    .ulink::after{transition:none}
    .d3-scene{--d3-duree:.01s}
    .d3-passeport{transition:opacity .4s ease;transform:none}
  }
  @media (max-width: 700px){
    .cs-footer-cols{justify-content:flex-start !important}
    .cs-footer-cols>div{flex:1 1 100% !important;max-width:none !important}
    .cs-pdp-gallery{flex-direction:row !important;gap:10px !important;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100vw;margin-left:calc(50% - 50vw);padding:0 20px}
    .cs-pdp-gallery::-webkit-scrollbar{display:none}
    .cs-pdp-shot{flex:0 0 86% !important;scroll-snap-align:center}
    .cs-pdp-info{position:static !important;padding:clamp(24px,6vw,32px) 20px 0 !important}
    .cs-related-grid{grid-template-columns:repeat(2,1fr) !important;gap:24px 12px !important}
    .cs-profile-grid{grid-template-columns:1fr !important}
    .cs-faq-grid{grid-template-columns:1fr !important}
    .cs-pieces-grid{grid-template-columns:repeat(2,1fr) !important;gap:20px 12px !important}
  }
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, Fragment } = React;

const prefersReduced = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* hero parallax: while the ancestor [data-parallax-hero] is on screen, translate this element
   by (scroll-past-top * speed), optionally upward and/or fading out — imperative style writes
   (no React state/re-render) so it stays smooth on every scroll tick. */
function useHeroParallax(speed, opts) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el || prefersReduced()) return;
    const hero = el.closest('[data-parallax-hero]');
    if (!hero) return;
    let raf = null;
    const update = () => {
      raf = null;
      const rect = hero.getBoundingClientRect();
      if (rect.bottom <= 0 || rect.top >= window.innerHeight) return;
      const y = Math.max(0, -rect.top);
      const ty = y * speed * (opts && opts.up ? -1 : 1);
      const sc = (opts && opts.scale) || 1;
      el.style.transform = (sc !== 1 ? 'scale(' + sc + ') ' : '') + 'translateY(' + ty + 'px)';
      if (opts && opts.fade) {
        el.style.opacity = String(Math.max(0, 1 - y / (rect.height * (opts.fadeOver || .6))));
      }
    };
    const onScroll = () => { if (raf == null) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, [speed, opts && opts.up, opts && opts.fade, opts && opts.fadeOver, opts && opts.scale]);
  return ref;
}

/* intro / loading screen: full-bleed bordeaux, CS monogram centred and still.
   Holds ~1.2s, then a single continuous radial motion — clip-path circle
   150% -> 0%, no sliding panels — closes in on itself and reveals the portal.
   Unmounts at 2.8s. */
function IntroSeal({ onDone }) {
  const [closing, setClosing] = useState(false);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const t1 = setTimeout(() => setClosing(true), 1200);
    const t2 = setTimeout(() => { document.body.style.overflow = prev; onDone(); }, 2800);
    return () => { [t1, t2].forEach(clearTimeout); document.body.style.overflow = prev; };
  }, []);
  const clip = 'circle(' + (closing ? '0%' : '150%') + ' at 50% 50%)';
  return (
    <div aria-hidden="true" style={{
      position: 'fixed', inset: 0, zIndex: 100000, pointerEvents: closing ? 'none' : 'auto',
      background: 'rgb(71,29,27)', clipPath: clip, WebkitClipPath: clip,
      transition: 'clip-path 1.6s cubic-bezier(.65,0,.35,1)'
    }}>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: closing ? 0 : 1, transition: 'opacity .5s ease-out' }}>
        <img src="assets/CS-LOGOMARK.svg" alt="" style={{ width: 'clamp(64px,9vw,110px)', height: 'auto', filter: 'brightness(0) invert(1)' }} />
      </div>
    </div>
  );
}

/* ---------- inline-style-string parser: keeps DS style strings verbatim ---------- */
function st(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    let k = decl.slice(0, i).trim();
    let v = decl.slice(i + 1).trim();
    if (!k) return;
    if (k.startsWith('--')) { o[k] = v; return; }
    if (k.startsWith('-')) {
      k = k.slice(1).split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
    } else {
      k = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    }
    o[k] = v;
  });
  return o;
}

/* ---------- photography wired into the design's image zones ---------- */
const PH = {
  piscine: 'assets/photos/lifestyle-piscine.jpg',
  terrasse: 'assets/photos/lifestyle-terrasse.jpg',
  porte: 'assets/photos/piece-portee.jpg',
  studio: 'assets/photos/piece-studio.jpg',
  coffret: 'assets/photos/coffret.jpg',
  huperanoHero: 'assets/photos/huperano-hero.jpeg',
  portraitSoie: 'assets/photos/portrait-soie.jpeg',
  huperanoMains: 'assets/photos/huperano-mains.jpeg',
  radahMontgolfiere: 'assets/photos/radah-montgolfiere.jpeg',
  croquisRadah: 'assets/photos/croquis-radah.jpeg',
  atelierTextureCuir: 'assets/photos/atelier-texture-cuir.png',
  atelierCouturePatch: 'assets/photos/atelier-couture-patch.png',
  sentinelleFemme: 'assets/photos/sentinelle-femme.png',
  sentinelleHomme: 'assets/photos/sentinelle-homme.png',
  lifestyleCoupleVoyage: 'assets/photos/lifestyle-couple-voyage.png',
  portraitCarole: 'assets/photos/image-carole.jpeg'
};
const VIDEOS = {
  'cs-hardware-flatlay': 'assets/photos/hardware-flatlay.mp4'
};
const LOTTIES = {
  'cs-sentinelle-accueil': 'assets/photos/sentinelle-recherche-femme.json',
  'cs-sentinelle-saisie': 'assets/photos/sentinelle-saisie.json',
  'cs-sentinelle-verif': 'assets/photos/sentinelle-recherche-homme.json',
  'cs-sentinelle-confirm': 'assets/photos/sentinelle-confirmation.json'
};
const PHOTOS = {
  'cs-p-huperano': PH.huperanoHero,
  'cs-maison-hero': PH.atelierTextureCuir,
  'cs-maison-portrait': PH.portraitCarole,
  'cs-maison-atelier2': PH.atelierCouturePatch,
  'cs-hero-huperano': PH.huperanoHero,
  'cs-portrait-soie': PH.portraitSoie,
  'cs-huperano-mains': PH.huperanoMains,
  'cs-radah-montgolfiere': PH.radahMontgolfiere,
  'cs-croquis-radah': PH.croquisRadah,
  'cs-coffret-ferme': PH.coffret,
  'cs-maison-sentinelle-femme': PH.sentinelleFemme,
  'cs-maison-sentinelle-homme': PH.sentinelleHomme,
  'cs-maison-voir-pieces': PH.lifestyleCoupleVoyage,
  'cs-passeport-piece': PH.studio,
  'cs-profil-piece': PH.studio
};
function photoFor(id) {
  if (!id) return null;
  if (PHOTOS[id]) return PHOTOS[id];
  if (id.indexOf('cs-p-') === 0) return id.slice(-4) === '-alt' ? PH.porte : PH.studio;
  if (id.indexOf('cs-cat-') === 0) return PH.terrasse;
  if (id.indexOf('cs-t') === 0) { const n = id.slice(4); return n === '1' ? PH.porte : n === '2' ? PH.coffret : PH.terrasse; }
  return null;
}

/* ============================ design-system components ============================ */
function LottiePlayer({ src, label }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof lottie === 'undefined') return;
    const anim = lottie.loadAnimation({
      container: ref.current, renderer: 'svg', loop: true, autoplay: !prefersReduced(), path: src
    });
    if (prefersReduced()) anim.goToAndStop(0, true);
    return () => anim.destroy();
  }, [src]);
  return <div ref={ref} role="img" aria-label={label} style={{ width: '100%', height: '100%' }}></div>;
}

function ImageSlot({ id, shape = 'rect', placeholder = 'Image', style }) {
  const hasSize = style && (style.width || style.height);
  const box = hasSize
    ? { position: 'relative', ...style }
    : { position: 'absolute', inset: 0, width: '100%', height: '100%' };
  const videoSrc = id && VIDEOS[id];
  if (videoSrc) {
    return (
      <div style={{ ...box, overflow: 'hidden', borderRadius: shape === 'circle' ? '50%' : 0 }}>
        <video src={videoSrc} aria-label={placeholder} autoPlay muted loop playsInline style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
      </div>
    );
  }
  const lottieSrc = id && LOTTIES[id];
  if (lottieSrc) {
    return (
      <div style={{ ...box, overflow: 'hidden', borderRadius: shape === 'circle' ? '50%' : 0 }}>
        <LottiePlayer src={lottieSrc} label={placeholder} />
      </div>
    );
  }
  const src = photoFor(id);
  if (src) {
    return (
      <div style={{ ...box, overflow: 'hidden', borderRadius: shape === 'circle' ? '50%' : 0 }}>
        <img src={src} alt={placeholder} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
      </div>
    );
  }
  return (
    <div aria-label={placeholder} style={{
      ...box, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center',
      padding: 12, boxSizing: 'border-box',
      background: 'repeating-linear-gradient(45deg,rgba(71,29,27,.05),rgba(71,29,27,.05) 12px,rgba(71,29,27,.09) 12px,rgba(71,29,27,.09) 24px)',
      color: 'rgba(71,29,27,.5)', font: '500 10px/1.4 var(--font-body)', letterSpacing: '.1em',
      textTransform: 'uppercase', borderRadius: shape === 'circle' ? '50%' : 0
    }}>
      <span style={{ maxWidth: '85%' }}>{placeholder}</span>
    </div>
  );
}

function Button({ variant = 'primary', size = 'md', disabled = false, className, style, onClick, type, children }) {
  const sizes = { md: { padding: '20px 30px', font: 18 }, sm: { padding: '14px 24px', font: 16 } };
  const sz = sizes[size] || sizes.md;
  const base = {
    display: 'inline-flex', flexDirection: 'row', gap: 10, justifyContent: 'center', alignItems: 'center',
    padding: sz.padding, fontFamily: 'var(--font-body)', fontWeight: 700, fontSize: sz.font, lineHeight: '28px',
    border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', boxSizing: 'border-box',
    transition: 'background-color .15s ease, color .15s ease, opacity .15s ease', opacity: disabled ? 0.4 : 1
  };
  const variants = {
    primary: { backgroundColor: 'var(--brand-bordeaux)', color: 'var(--ink-on-dark)' },
    secondary: { backgroundColor: 'transparent', color: 'var(--brand-bordeaux)', boxShadow: 'inset 0 0 0 2px var(--brand-bordeaux)' },
    ghost: { backgroundColor: 'var(--surface-page)', color: 'var(--ink)', fontWeight: 400 },
    light: { backgroundColor: 'var(--surface-page)', color: 'var(--ink)' }
  };
  return (
    <button className={className} disabled={disabled} onClick={onClick} type={type || 'button'}
      style={{ ...base, ...variants[variant], ...style }}>
      {children ?? 'Bouton'}
    </button>
  );
}

function AccordionItem({ open = false, question, answer, onToggle, className, style }) {
  return (
    <div className={className} style={{ borderBottom: '1px solid var(--line-hairline)', ...style }}>

      });
      measure();
    };
    requestAnimationFrame(measure);
    // re-measure once the display/body webfonts swap in — their metrics differ from the
    // fallback stack, so the very first (pre-font) measurement can under/over-estimate overlap
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure); } catch (e) {}
    const t = setTimeout(measure, 400);
    window.addEventListener('resize', onR);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { clearTimeout(t); window.removeEventListener('resize', onR); window.removeEventListener('scroll', onScroll); };
  }, []);

  /* fade-in on scroll for .reveal blocks (cartes, FAQ…) and .sec-reveal blocks
     (chaque bloc de section, sur toutes les pages — même mécanisme, même toggle .in) */
  useEffect(() => {
    const nodes = document.querySelectorAll('#root .reveal:not(.in), #root .sec-reveal:not(.in)');
    if (!nodes.length) return;
    if (prefersReduced() || !('IntersectionObserver' in window)) {
      nodes.forEach(n => n.classList.add('in'));
      return;
    }
    const io = new IntersectionObserver(ents => {
      ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    nodes.forEach(n => io.observe(n));
    const safety = setTimeout(() => nodes.forEach(n => n.classList.add('in')), 1600);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, [s.route, s.pstep, s.step, s.prof]);

  /* -------------------- derived values (port of renderVals) -------------------- */
  const dec = PRODUCTS.map(p => {

/* ================================ Shell ================================ */
function Shell({ v }) {
  const iconBtn = { display: 'flex', alignItems: 'center', justifyContent: 'center', width: 44, height: 44, background: 'none', border: 0, color: 'inherit', cursor: 'pointer', padding: 0 };
  return (
    <div style={{ minHeight: '100vh', background: 'rgb(252,249,248)', fontFamily: 'var(--font-body)', color: 'rgb(0,0,0)', WebkitFontSmoothing: 'antialiased', marginTop: v.heroOffset }}>

      <header style={{ position: 'sticky', top: 0, zIndex: 40, background: v.headerBg, backdropFilter: v.headerBlur, WebkitBackdropFilter: v.headerBlur, color: v.headerColor, transitionProperty: 'background-color,backdrop-filter,color', transitionDuration: '.25s', transitionTimingFunction: 'cubic-bezier(.2,0,0,1)' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', columnGap: 16, width: '100%', maxWidth: 1920, margin: '0 auto', padding: '12px clamp(16px,3vw,60px)', height: 'clamp(56px,6vw,84px)' }}>
          <div style={{ gridColumn: 1, display: 'flex', alignItems: 'center', overflow: 'hidden' }}>
            <button type="button" className="fx-dim fx-press" aria-label="Menu" onClick={v.openMenu} style={iconBtn}>
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" strokeWidth="1"><path d="M0 1h18M0 6h18M0 11h18" /></svg>
            </button>
          </div>
          <button type="button" className="fx-press" aria-label="Accueil" onClick={v.goAccueil} style={{ gridColumn: 2, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'none', border: 0, cursor: 'pointer', padding: 0, color: 'inherit' }}>
            <span role="img" aria-label="Carole Sessegnon" style={{
              display: 'block', width: 'clamp(150px,22vw,300px)', aspectRatio: '770.11 / 56.86',
              backgroundColor: 'currentColor',
              WebkitMaskImage: 'url(assets/CS-LOGOTYPE.svg)', maskImage: 'url(assets/CS-LOGOTYPE.svg)',
              WebkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat',
              WebkitMaskPosition: 'center', maskPosition: 'center',
              WebkitMaskSize: 'contain', maskSize: 'contain'
            }}></span>
          </button>
        </div>
      </header>

      {v.menu && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgb(71,29,27)', color: 'rgb(255,255,255)', padding: 'clamp(20px,5vw,60px)', overflowY: 'auto', WebkitOverflowScrolling: 'touch', animation: 'cs-in .25s ease-out' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 'clamp(8px,2vw,30px)' }}>
            <button type="button" className="fx-dim fx-press" aria-label="Rechercher" onClick={v.openSearch} style={iconBtn}>
              <svg width="22" height="22" viewBox="0 0 17 17" fill="none" stroke="currentColor" strokeWidth=".9"><circle cx="7" cy="7" r="6" /><path d="M11.5 11.5 16 16" /></svg>
            </button>
            <button type="button" className="fx-dim fx-press" aria-label="Panier" onClick={v.goPanier} style={{ ...iconBtn, position: 'relative' }}>
              <svg width="21" height="23" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth=".9"><path d="M1 5h14l-1 12H2L1 5Z" /><path d="M5.5 5V3.5a2.5 2.5 0 0 1 5 0V5" /></svg>
              {v.hasCart && (
                <span key={v.s.cartBump} className={v.s.cartBump ? 'cs-badge-pulse' : undefined} style={{ position: 'absolute', top: 6, right: 5, minWidth: 16, height: 16, borderRadius: '50%', background: 'rgb(71,29,27)', color: 'rgb(255,255,255)', fontSize: 10, lineHeight: '16px', textAlign: 'center', fontWeight: 500 }}>{v.cartCount}</span>
              )}
            </button>
            <button type="button" aria-label="Fermer" onClick={v.closeOverlays} style={{ width: 44, height: 44, background: 'none', border: 0, color: 'inherit', cursor: 'pointer', fontSize: 22, fontFamily: 'var(--font-body)' }}>×</button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 22, marginTop: 40, maxWidth: 520 }}>
            {[['Accueil', v.goAccueil], ['La Maison', v.goMaison], ['Les Pièces', v.goPieces], ['Les règles de tendresse', v.goEntretien], ['Passeport numérique', v.goPasseport], ['Contact', v.goContact], ['FAQ', v.goFaq]].map(([label, fn]) => (
              <button key={label} type="button" onClick={fn} className="cs-menu-link" style={{ display: 'inline-block', alignSelf: 'flex-start', textAlign: 'left', background: 'none', border: 0, color: 'inherit', cursor: 'pointer', padding: 0, fontFamily: 'var(--font-display)', fontSize: 'clamp(26px,5vw,40px)', lineHeight: 1.1 }}>{label}</button>
            ))}
            <div style={{ height: 1, background: 'rgba(255,255,255,.22)', margin: '10px 0' }}></div>
            <button type="button" onClick={v.acctAction} style={{ display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left', background: 'none', border: 0, color: 'rgba(255,255,255,.85)', cursor: 'pointer', padding: 0, fontSize: 14, letterSpacing: '.12em', textTransform: 'uppercase' }}>
              <svg width="16" height="16" viewBox="0 0 17 17" fill="none" stroke="currentColor" strokeWidth="1"><circle cx="8.5" cy="5.5" r="3.5" /><path d="M1.5 16c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5" /></svg>
              {v.acctLabel}
            </button>
            <button type="button" onClick={v.goLegal} style={{ display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left', background: 'none', border: 0, color: 'rgba(255,255,255,.85)', cursor: 'pointer', padding: 0, fontSize: 14, letterSpacing: '.12em', textTransform: 'uppercase' }}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1"><rect x="2" y="1.5" width="12" height="13" rx="0" /><path d="M5 5h6M5 8h6M5 11h4" /></svg>
              Mentions légales
            </button>
          </div>
        </div>
      )}

      {v.search && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(252,249,248,.97)', padding: 'clamp(20px,5vw,60px)', animation: 'cs-in .25s ease-out', overflow: 'auto' }}>
          <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
            <button type="button" aria-label="Fermer" onClick={v.closeOverlays} style={{ width: 44, height: 44, background: 'none', border: 0, color: 'rgb(71,29,27)', cursor: 'pointer', fontSize: 22, fontFamily: 'var(--font-body)' }}>×</button>
          </div>
          <div style={{ maxWidth: 900, margin: '40px auto 0' }}>
            <label htmlFor="cs-q" style={{ display: 'block', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)', marginBottom: 12 }}>Rechercher une pièce</label>
            <input id="cs-q" type="search" value={v.q} onChange={v.setQ} placeholder="Nom, matière, coloris" style={{ width: '100%', padding: '14px 0', background: 'none', border: 0, borderBottom: '1px solid rgb(71,29,27)', fontFamily: 'var(--font-display)', fontSize: 'clamp(22px,4vw,34px)', color: 'rgb(71,29,27)' }} />
            <p style={{ fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)', margin: '34px 0 14px' }}>Résultats</p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(min(100%,145px),1fr))', gap: '20px 14px' }}>
              {v.results.map((p, i) => (
                <div key={i}>
                  <Oval p={p} />
                  <button type="button" onClick={p.open} style={{ display: 'block', width: '100%', padding: 0, background: 'none', border: 0, cursor: 'pointer', textAlign: 'left' }}>
                    <p style={{ margin: '12px 0 0', fontFamily: 'var(--font-display)', fontSize: 17, color: 'rgb(71,29,27)' }}>{p.name}</p>
                    <p style={{ margin: '5px 0 0', fontSize: 13, color: p.priceColor }}>{p.priceLabel}</p>
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <main style={{ minHeight: '60vh' }}>
        {v.isAccueil && <ScAccueil v={v} />}
        {v.isMaison && <ScMaison v={v} />}
        {v.isPieces && <ScPieces v={v} />}
        {v.isEntretien && <ScEntretien v={v} />}
        {v.isProduit && <ScProduit v={v} />}
        {v.isPanier && <ScPanier v={v} />}
        {v.isPaiement && <ScPaiement v={v} />}
        {v.isPasseport && <ScPasseport v={v} />}
        {v.isContact && <ScContact v={v} />}
        {v.isFaq && <ScFAQ v={v} />}
        {v.isConnexion && <ScConnexion v={v} />}
        {v.isProfil && <ScProfil v={v} />}
        {v.isCommande && <ScCommande v={v} />}
        {v.isLegal && <ScLegal v={v} />}
      </main>

      <div style={{ position: 'fixed', right: 'clamp(14px,2vw,28px)', bottom: 'clamp(14px,2vw,28px)', zIndex: 50, display: 'flex', flexDirection: 'column', gap: 12 }}>
        {v.showTop && (
          <button type="button" className="fx-press" aria-label="Retour en haut" onClick={v.scrollTop} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 48, height: 48, borderRadius: '50%', background: 'rgb(255,255,255)', border: 0, boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.15),0 12px 24px -8px rgba(0,0,0,.12)', color: 'rgb(71,29,27)', cursor: 'pointer' }}>
            <svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" strokeWidth="1"><path d="M7 15V1M1 7l6-6 6 6" /></svg>
          </button>
        )}
        <button type="button" className="fx-bordeaux fx-press" aria-label="Discuter avec la Maison" onClick={v.goContact} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 56, height: 56, borderRadius: '50%', background: 'rgb(71,29,27)', border: 0, color: 'rgb(255,255,255)', cursor: 'pointer', boxShadow: '0 12px 24px -8px rgba(0,0,0,.32)' }}>
          <svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="currentColor" strokeWidth="1"><path d="M21 9.5c0 4.4-4.5 8-10 8-1.2 0-2.4-.2-3.4-.5L1 19l1.6-3.8A7.4 7.4 0 0 1 1 9.5c0-4.4 4.5-8 10-8s10 3.6 10 8Z" /></svg>
        </button>
      </div>

      {v.showCartToast && (
        <div style={{ position: 'fixed', right: 'clamp(14px,4vw,32px)', top: 'calc(' + v.headerH + ' + clamp(10px,2vw,20px))', zIndex: 70, display: 'flex', alignItems: 'flex-start', gap: 12, background: 'rgb(71,29,27)', color: 'rgb(255,255,255)', padding: '14px 20px', boxShadow: '0 14px 30px -10px rgba(0,0,0,.4)', animation: 'cs-in .25s ease-out', maxWidth: 'calc(100vw - 28px)' }}>
          <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1" style={{ flexShrink: 0, marginTop: 2 }}><path d="M1 5h14l-1 12H2L1 5Z" /><path d="M5.5 5V3.5a2.5 2.5 0 0 1 5 0V5" /></svg>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <span style={{ fontSize: 14, whiteSpace: 'nowrap' }}>Ajouté au panier</span>
            <button type="button" onClick={v.goPanier} style={{ alignSelf: 'flex-start', flexShrink: 0, background: 'none', border: 0, padding: 0, color: 'rgb(255,255,255)', cursor: 'pointer', fontSize: 13, letterSpacing: '.08em', textTransform: 'uppercase', borderBottom: '1px solid rgba(255,255,255,.6)' }}>Voir le panier</button>
          </div>
        </div>
      )}

      <Footer v={v} />
    </div>
  );
}

function Footer({ v }) {
  const link = { background: 'none', border: 0, padding: 0, color: 'rgba(255,255,255,.9)', cursor: 'pointer', fontSize: 15 };
  const eyebrow = { margin: '0 0 18px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgba(255,255,255,.6)' };
  return (
    <footer style={{ background: 'rgb(71,29,27)', color: 'rgb(255,255,255)', padding: 'clamp(48px,7vw,80px) clamp(20px,5vw,140px) clamp(32px,4vw,48px)' }}>
      <div style={{ maxWidth: 1640, margin: '0 auto' }}>
        <div className="cs-footer-cols" style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 'clamp(70px,4vw,110px)', textAlign: 'left', maxWidth: 920, margin: '0 auto', paddingBottom: 'clamp(24px,3.5vw,40px)', borderBottom: '1px solid rgba(255,255,255,.2)' }}>
          <div style={{ flex: '0 1 180px' }}>
            <p style={eyebrow}>Menu</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'flex-start' }}>
              <button type="button" onClick={v.goAccueil} style={link}>Accueil</button>
              <button type="button" onClick={v.goMaison} style={link}>La Maison</button>
              <button type="button" onClick={v.goPieces} style={link}>Les Pièces</button>
              <button type="button" onClick={v.goEntretien} style={link}>Les règles de tendresse</button>
              <button type="button" onClick={v.goContact} style={link}>Contact</button>
              <button type="button" onClick={v.goFaq} style={link}>FAQ</button>
            </div>
          </div>
          <div style={{ flex: '0 1 220px' }}>
            <p style={eyebrow}>Plus d'informations</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'flex-start' }}>
              <button type="button" onClick={v.goPasseport} style={link}>Passeport numérique</button>
              <button type="button" onClick={v.goLegal} style={link}>Mentions légales</button>
              <button type="button" onClick={v.goCGV} style={link}>CGV</button>
              <button type="button" onClick={v.goRGPD} style={link}>Politique de confidentialité</button>
            </div>
          </div>
          <div style={{ flex: '1 1 280px', maxWidth: 360 }}>
            <p style={eyebrow}>L'univers <span style={{ fontFamily: "'Tamil MN', var(--font-display)" }}>Carole Sessegnon</span></p>
            <p style={{ margin: '0 0 16px', fontSize: 15, lineHeight: 1.6, color: 'rgba(255,255,255,.82)' }}>Découvrez en avant-première les nouvelles pièces et les actualités de la Maison.</p>
            <form onSubmit={v.submitNews} style={{ display: 'flex', gap: 0, flexWrap: 'wrap' }}>
              <input name="news" type="email" required placeholder="Votre e-mail" style={{ flex: 1, minWidth: 160, height: 52, padding: '0 16px', background: 'transparent', border: 0, boxShadow: 'inset 0 0 0 1px rgba(255,255,255,.45)', color: 'rgb(255,255,255)', fontSize: 15 }} />
              <button type="submit" style={{ height: 52, padding: '0 22px', background: 'rgb(255,255,255)', border: 0, color: 'rgb(71,29,27)', cursor: 'pointer', fontSize: 13, letterSpacing: '.1em', textTransform: 'uppercase' }}>OK</button>
            </form>
            {v.newsOk && <p style={{ margin: '12px 0 0', fontSize: 14, color: 'rgba(255,255,255,.82)' }}>Merci, votre inscription a bien été enregistrée.</p>}
          </div>
        </div>
        <div style={{ paddingTop: 'clamp(24px,3.5vw,36px)', textAlign: 'center' }}>
          <img src="assets/CS-LOGOMARK.svg" alt="Monogramme Carole Sessegnon" style={{ width: 44, height: 'auto', display: 'block', margin: '0 auto 18px', filter: 'brightness(0) invert(1)' }} />
          <span role="img" aria-label="Carole Sessegnon" style={{
            display: 'block', width: 'clamp(170px,30vw,360px)', maxWidth: '80%', aspectRatio: '770.11 / 56.86', margin: '0 auto 26px',
            backgroundColor: 'currentColor',
            WebkitMaskImage: 'url(assets/CS-LOGOTYPE.svg)', maskImage: 'url(assets/CS-LOGOTYPE.svg)',
            WebkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat',
            WebkitMaskPosition: 'center', maskPosition: 'center',
            WebkitMaskSize: 'contain', maskSize: 'contain'
          }}></span>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 24, marginBottom: 30 }}>
            <a href="#" aria-label="Instagram" style={{ color: 'rgba(255,255,255,.85)', display: 'flex', width: 44, height: 44, alignItems: 'center', justifyContent: 'center' }}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1"><rect x="1" y="1" width="16" height="16" rx="4" /><circle cx="9" cy="9" r="4" /><circle cx="13.4" cy="4.6" r=".8" fill="currentColor" stroke="none" /></svg>
            </a>
            <a href="#" aria-label="Facebook" style={{ color: 'rgba(255,255,255,.85)', display: 'flex', width: 44, height: 44, alignItems: 'center', justifyContent: 'center' }}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1"><path d="M11.5 5.5h2.2M11.5 5.5c0-2 .8-3 2.2-3M11.5 5.5V17M8 9h6" /></svg>
            </a>
            <a href="#" aria-label="Pinterest" style={{ color: 'rgba(255,255,255,.85)', display: 'flex', width: 44, height: 44, alignItems: 'center', justifyContent: 'center' }}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1"><circle cx="9" cy="9" r="8" /><path d="M7 17c1.4-3.6 2.2-6.8 2.2-6.8M6.4 7.6c0-1.8 1.4-3 3-3s2.8 1 2.8 2.8c0 2-1.2 3.6-2.8 3.6-.9 0-1.6-.7-1.4-1.6" /></svg>
            </a>
          </div>
          <p style={{ margin: 0, fontSize: 13, color: 'rgba(255,255,255,.7)' }}>© 2026 <span style={{ fontFamily: "'Tamil MN', var(--font-display)" }}>Carole Sessegnon</span> — Tous droits réservés</p>
        </div>
      </div>
    </footer>
  );
}

function FAQBlock({ v, center }) {
  return (
    <div style={{ margin: center ? '0 auto' : undefined, maxWidth: 900, textAlign: center ? 'center' : 'left', marginLeft: center ? 'auto' : undefined, marginRight: center ? 'auto' : undefined }}>
      <p style={{ margin: '0 0 6px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Foire aux questions</p>
      <h2 style={{ margin: '0 0 26px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(24px,3.4vw,34px)', color: 'rgb(71,29,27)' }}>Les questions fréquentes</h2>
      {v.faqItems.map((i, k) => (
        <AccordionItem key={k} className="reveal" question={i.q} answer={i.a} open={i.open} onToggle={i.toggle} style={{ textAlign: 'left', transitionDelay: (k * 45) + 'ms' }} />
      ))}
    </div>
  );
}

/* ================================ Screens ================================ */
function ScAccueil({ v }) {
  const heroImgRef = useHeroParallax(0.08, { scale: 1.15 });
  const heroTxtRef = useHeroParallax(0.28, { up: true, fade: true, fadeOver: .6 });
  const portraitImgRef = useHeroParallax(0.05, { scale: 1.08 });
  const mainsImgRef = useHeroParallax(0.08, { scale: 1.15 });
  const mainsTxtRef = useHeroParallax(0.28, { up: true, fade: true, fadeOver: .6 });
  const croquisImgRef = useHeroParallax(0.05, { scale: 1.08 });
  const radahImgRef = useHeroParallax(0.08, { scale: 1.15 });
  const radahTxtRef = useHeroParallax(0.28, { up: true, fade: true, fadeOver: .6 });
  const coffretImgRef = useHeroParallax(0.05, { scale: 1.08 });
  return (
    <section>
      {/* 1. hero L'Huperano */}
      <div data-parallax-hero style={{ position: 'relative', height: 'calc(100vh - ' + v.headerH + ')', overflow: 'hidden' }}>
        <div ref={heroImgRef} style={{ position: 'absolute', inset: 0 }}>
          <ImageSlot id="cs-hero-huperano" placeholder="L'Huperano — visuel d'ouverture" />
        </div>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)', pointerEvents: 'none' }}></div>
        <div ref={heroTxtRef} style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: 'clamp(20px,5vw,140px)', pointerEvents: 'none' }}>
          <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 400, fontSize: 'clamp(34px,6vw,64px)', color: 'rgb(255,255,255)' }}>L'Huperano</h1>
          <button type="button" className="ulink" onClick={() => v.go('produit', { pid: 'huperano', open: 0 })} style={{ marginTop: 22, pointerEvents: 'auto', background: 'none', border: 0, padding: '0 0 5px', color: 'rgb(255,255,255)', cursor: 'pointer', fontSize: 15 }}>Découvrir&nbsp;&nbsp;→</button>
        </div>
      </div>

      {/* 2. citation d'ouverture */}
      <div className="sec-reveal" style={{ padding: 'clamp(64px,10vw,120px) clamp(20px,5vw,140px) clamp(36px,5vw,64px)', maxWidth: 760, margin: '0 auto', textAlign: 'center' }}>
        <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 400, fontSize: 'clamp(24px,3vw,32px)', color: 'rgb(71,29,27)' }}>Attire les regards sans jamais voler la lumière à celle qui le porte.</p>
      </div>

      {/* 3. portrait soie — contenu, pas plein écran */}
      <div className="sec-reveal" style={{ padding: 'clamp(14px,2vw,22px) clamp(20px,5vw,140px) 0' }}>
        <div data-parallax-hero style={{ position: 'relative', aspectRatio: '.72', maxWidth: 520, margin: '0 auto', overflow: 'hidden' }}>
          <div ref={portraitImgRef} style={{ position: 'absolute', inset: 0 }}>
            <ImageSlot id="cs-portrait-soie" placeholder="Portrait — soie" />
          </div>
        </div>
      </div>

      {/* 5. plein écran — les mains */}
      <div className="sec-reveal" data-parallax-hero style={{ position: 'relative', height: 'clamp(420px,72vh,760px)', marginTop: 'clamp(56px,9vw,100px)', overflow: 'hidden' }}>
        <div ref={mainsImgRef} style={{ position: 'absolute', inset: 0 }}>
          <ImageSlot id="cs-huperano-mains" placeholder="L'Huperano — le geste, les mains" />
        </div>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 40%)', pointerEvents: 'none' }}></div>
        <div ref={mainsTxtRef} style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: 'clamp(20px,5vw,140px)', pointerEvents: 'none' }}>
          <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 400, fontStyle: 'italic', fontSize: 'clamp(34px,6vw,64px)', lineHeight: 1.06, color: 'rgb(255,255,255)' }}>Nouveau design</p>
          <button type="button" className="cs-grad-ulink" onClick={v.goPieces} style={{ marginTop: 14, pointerEvents: 'auto', background: 'none', border: 0, padding: '0 0 5px', color: 'rgb(255,255,255)', cursor: 'pointer', fontSize: 15 }}>Découvrir&nbsp;&nbsp;→</button>
        </div>

    </section>

}

function ScProduit({ v }) {
  const c = v.current;
  const images = [c.slot, 'cs-t1', 'cs-t2', 'cs-t3'];
  const labels = ['Photo produit principale', 'Détail 1', 'Détail 2', 'Détail 3'];
  const [imgIdx, setImgIdx] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  const [notifySent, setNotifySent] = useState(false);

  const submitNotify = e => { e.preventDefault(); setNotifySent(true); };
  const prevImg = () => setImgIdx(i => (i - 1 + images.length) % images.length);

    <button key={i} type="button" aria-label={'Voir ' + labels[i]} onClick={() => setImgIdx(i)} style={{
      position: 'relative', width: size, height: size, flex: '0 0 auto', overflow: 'hidden', padding: 0, cursor: 'pointer',
      border: 0, boxShadow: i === imgIdx ? 'inset 0 0 0 2px rgb(71,29,27)' : 'inset 0 0 0 1px rgba(0,0,0,.15)',

    <Fragment>
    <section style={{ padding: '0 0 clamp(56px,9vw,110px)', maxWidth: 1640, margin: '0 auto' }}>

          {images.map((id, i) => (
            <div key={i} className="cs-pdp-shot" onClick={() => { setImgIdx(i); setLightbox(true); }}>
              <ImageSlot id={id} placeholder={labels[i]} />

        <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(34px,4.8vw,54px)', lineHeight: 1.05, color: 'rgb(71,29,27)' }}>{c.name}</h1>
        <p style={{ margin: '18px 0 0', fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 400, fontSize: 'clamp(19px,2vw,23px)', lineHeight: 1.45, color: 'rgba(71,29,27,.75)', maxWidth: '30ch', textWrap: 'pretty' }}>{c.tagline}</p>
        <div style={{ width: 'min(100%,260px)', height: 1, background: 'rgba(71,29,27,.18)', margin: 'clamp(28px,3.4vw,38px) 0' }}></div>
        <p style={{ margin: 0, fontSize: 19, letterSpacing: '.06em', color: 'rgb(0,0,0)', fontVariantNumeric: 'tabular-nums' }}>{c.priceLabel}</p>
        <p style={{ margin: '12px 0 0', fontSize: 12, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>{c.material}</p>

        {c.available && (
          <div style={{ marginTop: 'clamp(28px,3.4vw,38px)' }}>
            {c.hasTeinte && (
              <Fragment>
                <p style={{ margin: '0 0 16px', fontSize: 12, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Couleur — <span style={{ color: 'rgb(71,29,27)' }}>{v.teinte}</span></p>
                <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
                  {v.teintes.map((t, i) => (
                    <button key={i} type="button" onClick={t.pick} aria-label={t.label} aria-pressed={t.active} title={t.label} style={{
                      width: 34, height: 34, padding: 0, borderRadius: '50%', border: 0, cursor: 'pointer', background: t.hex,
                      boxShadow: t.active ? '0 0 0 2px rgb(252,249,248), 0 0 0 3px rgb(71,29,27)' : 'inset 0 0 0 1px rgba(0,0,0,.2)'
                    }}></button>
                  ))}
                </div>
              </Fragment>
            )}
            <div style={{ marginTop: 'clamp(26px,3vw,34px)' }}>
              <Button variant="primary" onClick={v.addCurrent} style={v.btnUpper.style}>
                <svg width="15" height="17" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1"><path d="M1 5h14l-1 12H2L1 5Z" /><path d="M5.5 5V3.5a2.5 2.5 0 0 1 5 0V5" /></svg>
                Ajouter au panier
              </Button>
            </div>
            <button type="button" className="ulink" onClick={v.toggleCurrentFav} style={{ display: 'inline-flex', alignItems: 'center', gap: 9, marginTop: 22, background: 'none', border: 0, padding: '0 0 5px', color: v.currentFav ? 'rgb(71,29,27)' : 'rgb(94,94,94)', cursor: 'pointer', fontSize: 12, letterSpacing: '.14em', textTransform: 'uppercase' }}>
              <svg width="15" height="14" viewBox="0 0 15 14" fill={v.currentFav ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1"><path d="M7.5 12.6 2.1 7.4a3.2 3.2 0 0 1 4.5-4.5l.9.9.9-.9a3.2 3.2 0 0 1 4.5 4.5l-5.4 5.2Z" /></svg>
              {v.currentFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}
            </button>
          </div>
        )}
        {c.soon && (
          <div style={{ marginTop: 30, maxWidth: 420, padding: 22, boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.15)' }}>
            <p style={{ margin: '0 0 14px', fontSize: 13, letterSpacing: '.16em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>En rupture de stock</p>
            {notifySent ? (
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.6, color: 'rgb(70,70,70)' }}>Merci, nous vous préviendrons par e-mail dès que cette pièce sera de nouveau disponible.</p>

              <form onSubmit={submitNotify} style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>

                <Button type="submit" variant="primary" style={{ fontSize: 13 }}>Me prévenir quand elle sera disponible</Button>
              </form>
            )}
          </div>
        )}

      </div>
      </div>

      <div style={{ padding: '0 clamp(20px,5vw,140px)' }}>
      {c.story && (
        <div className="sec-reveal" style={{ marginTop: 'clamp(56px,8vw,110px)', maxWidth: 820 }}>
          <p style={{ margin: '0 0 18px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Le récit de la pièce</p>
          <p style={{ margin: '0 0 22px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(21px,2.6vw,30px)', lineHeight: 1.4, color: 'rgb(71,29,27)', textWrap: 'pretty' }}>{c.story.lead}</p>
          <p style={{ margin: 0, fontSize: 17, lineHeight: 1.8, color: 'rgb(70,70,70)', textWrap: 'pretty' }}>{c.story.body}</p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'clamp(24px,5vw,64px)', marginTop: 'clamp(30px,4vw,46px)', paddingTop: 'clamp(22px,3vw,30px)', borderTop: '1px solid rgba(71,29,27,.15)' }}>
            {[['Atelier', 'Abidjan, Côte d’Ivoire'], ['Numérotation', 'Pièce numérotée à la main'], ['Passeport numérique', 'Inclus dans le coffret']].map(([k, val], i) => (
              <div key={i} style={{ flex: '1 1 180px', minWidth: 150 }}>
                <p style={{ margin: '0 0 8px', fontSize: 11, letterSpacing: '.16em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>{k}</p>
                <p style={{ margin: 0, fontSize: 15, lineHeight: 1.6, color: 'rgb(71,29,27)' }}>{val}</p>
              </div>
            ))}

      <div className="sec-reveal" style={{ marginTop: 'clamp(48px,7vw,90px)', maxWidth: 820 }}>
        {v.accordion.map((a, i) => (
          <AccordionItem key={i} question={a.title} answer={a.body} open={a.open} onToggle={a.toggle} />
        ))}
        <div style={{ borderTop: '1px solid rgba(0,0,0,.15)' }}></div>
      </div>

      <div className="sec-reveal" style={{ marginTop: 'clamp(48px,7vw,90px)' }}>
        <h2 style={{ margin: '0 0 32px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(24px,3.4vw,34px)', color: 'rgb(71,29,27)' }}>Vous aimerez aussi</h2>
        <div className="cs-related-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(min(100%,200px),1fr))', gap: '32px 20px' }}>
          {v.related.map((p, i) => (
            <div key={i} className="reveal" style={{ transitionDelay: (i * 55) + 'ms' }}>
              <Oval p={p} />
              <button type="button" className="fx-press99" onClick={p.open} style={{ display: 'block', width: '100%', padding: 0, background: 'none', border: 0, cursor: 'pointer', textAlign: 'left' }}>
                <p style={{ margin: '16px 0 0', fontFamily: 'var(--font-display)', fontSize: 20, color: 'rgb(71,29,27)' }}>{p.name}</p>
                <p style={{ margin: '6px 0 0', fontSize: 14, color: p.priceColor }}>{p.priceLabel}</p>
              </button>
            </div>
          ))}
        </div>
      </div>

      <div className="sec-reveal" style={{ marginTop: 'clamp(48px,7vw,90px)', maxWidth: 820 }}>
        <FAQBlock v={v} />
      </div>
      </div>
    </section>

    {lightbox && (
      <div style={{ position: 'fixed', inset: 0, zIndex: 200, background: 'rgb(245,242,240)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <button type="button" aria-label="Fermer" onClick={() => setLightbox(false)} style={{ position: 'absolute', top: 24, right: 24, zIndex: 2, width: 44, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'none', border: 0, cursor: 'pointer', color: 'rgb(0,0,0)' }}>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M2 2l16 16M18 2L2 18" /></svg>
        </button>
        <button type="button" aria-label="Image précédente" onClick={prevImg} style={{ position: 'absolute', left: 24, top: '50%', transform: 'translateY(-50%)', zIndex: 2, width: 48, height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'none', border: 0, cursor: 'pointer', color: 'rgb(0,0,0)' }}>
          <svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 1 2 11l10 10" /></svg>
        </button>
        <button type="button" aria-label="Image suivante" onClick={nextImg} style={{ position: 'absolute', right: 24, top: '50%', transform: 'translateY(-50%)', zIndex: 2, width: 48, height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'none', border: 0, cursor: 'pointer', color: 'rgb(0,0,0)' }}>
          <svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M2 1l10 10L2 21" /></svg>

          <ImageSlot id={images[imgIdx]} placeholder={labels[imgIdx]} />

        <div style={{ position: 'absolute', right: 24, bottom: 24, zIndex: 2, display: 'flex', gap: 8 }}>
          {images.map((id, i) => thumbBtn(i, 56))}
        </div>
      </div>
    )}
    </Fragment>
  );
}

                      <Button variant="secondary" size="sm" onClick={v.openGift} style={{ width: '100%' }}>Ajouter un message</Button>
                    </>
                  )}
                </div>
              </div>
              {v.s.giftOpen && (
                <div onClick={v.closeGift} style={{ position: 'fixed', inset: 0, zIndex: 90, background: 'rgba(0,0,0,.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, animation: 'cs-in .2s ease-out' }}>
                  <form onClick={e => e.stopPropagation()} onSubmit={v.saveGift} role="dialog" aria-modal="true" aria-label="Votre message" style={{ background: 'rgb(255,251,248)', width: 'min(520px,100%)', maxHeight: '100%', overflow: 'auto', padding: 'clamp(22px,4vw,36px)' }}>
                    <h2 style={{ margin: '0 0 6px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 26, color: 'rgb(71,29,27)' }}>Votre message</h2>
                    <p style={{ margin: '0 0 22px', fontSize: 14, lineHeight: 1.6, color: 'rgb(94,94,94)' }}>Il accompagnera la pièce, de la part de la Maison.</p>
                    <label style={{ display: 'block', fontSize: 13, color: 'rgb(94,94,94)' }}>Prénom du destinataire (facultatif)
                      <input type="text" value={v.s.giftTo} onChange={v.setGiftTo} style={{ display: 'block', marginTop: 8, width: '100%', height: 48, padding: '0 14px', background: 'rgb(255,255,255)', border: 0, boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.2)', fontSize: 16, color: 'rgb(0,0,0)' }} />
                    </label>
                    <label style={{ display: 'block', marginTop: 18, fontSize: 13, color: 'rgb(94,94,94)' }}>Votre message
                      <textarea autoFocus rows={5} value={v.s.giftMsg} onChange={v.setGiftMsg} maxLength={250} style={{ display: 'block', marginTop: 8, width: '100%', padding: 14, background: 'rgb(255,255,255)', border: 0, boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.2)', fontSize: 16, lineHeight: 1.6, color: 'rgb(0,0,0)', resize: 'vertical', fontFamily: 'inherit' }} />
                    </label>
                    <p style={{ margin: '6px 0 0', fontSize: 12, textAlign: 'right', color: 'rgb(94,94,94)' }}>{v.s.giftMsg.length} / 250</p>
                    <div style={{ display: 'flex', gap: 18, alignItems: 'center', flexWrap: 'wrap', marginTop: 20 }}>
                      <Button variant="primary" type="submit" disabled={!v.s.giftMsg.trim()}>Enregistrer le message</Button>
                      <button type="button" onClick={v.closeGift} style={{ background: 'none', border: 0, padding: 0, color: 'rgb(71,29,27)', cursor: 'pointer', fontSize: 14, borderBottom: '1px solid rgb(71,29,27)' }}>Annuler</button>
                    </div>
                  </form>
                </div>
              )}
              <Button variant="primary" onClick={v.goPaiement} style={{ ...v.btnBlock.style, marginTop: 24 }}>Passer au paiement</Button>
              <p style={{ margin: '16px 0 0', fontSize: 13, lineHeight: 1.6, color: 'rgb(94,94,94)' }}>Paiement sécurisé — carte bancaire, PayPal, Wave, Orange Money.</p>
            </div>
          </div>

          <div className="sec-reveal" style={{ marginTop: 'clamp(48px,7vw,90px)', maxWidth: 900 }}>
            <FAQBlock v={v} />
          </div>
        </Fragment>
      )}
    </section>
  );
}

          <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap' }}>

    </section>
  );

function Portes3D({ v }) {
  const [ouvert, setOuvert] = useState(false);
  const [zoom, setZoom] = useState(false);
  useEffect(() => {
    if (prefersReduced()) { setOuvert(true); return; }
    const t = setTimeout(() => setOuvert(true), 2000);
    return () => clearTimeout(t);
  }, []);
  const decouvrir = () => {
    if (prefersReduced()) { v.pDecouvrirPiece(); return; }
    setZoom(true);
    setTimeout(v.pDecouvrirPiece, 500);
  };
  return (
    <div className="cs-door3d">
      <div dangerouslySetInnerHTML={{ __html: D3_DEFS }}></div>
      <div className={'d3-scene' + (ouvert ? ' d3-ouvert' : '') + (zoom ? ' d3-zoom' : '')}>

          <h1 className="d3-marque" dangerouslySetInnerHTML={{ __html: D3_MARQUE }}></h1>

}

                    <p style={{ margin: 0, fontSize: 15, fontVariantNumeric: 'tabular-nums', color: 'rgb(0,0,0)' }}>{o.total}</p>
                    <p style={{ margin: '6px 0 0', fontSize: 13, letterSpacing: '.1em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>{o.statut}</p>
                  </div>
                </button>
              ))}
              <div style={{ borderTop: '1px solid rgba(0,0,0,.15)' }}></div>
            </div>
          )}
          {v.profPieces && (
            <div>
              <h2 style={{ margin: '0 0 22px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(22px,3vw,30px)', color: 'rgb(71,29,27)' }}>Mes pièces</h2>
              <p style={{ margin: '0 0 26px', fontSize: 16, lineHeight: 1.7, color: 'rgb(70,70,70)', maxWidth: '56ch' }}>Les pièces associées à votre nom via leur passeport numérique.</p>
              <div style={{ display: 'flex', gap: 18, alignItems: 'center', padding: '20px 0', borderTop: '1px solid rgba(0,0,0,.15)' }}>
                <div style={{ flex: '0 0 72px', position: 'relative', width: 72, aspectRatio: '.68', overflow: 'hidden', borderRadius: '50%', outline: '1px solid rgba(0,0,0,.1)', outlineOffset: '-1px' }}>
                  <ImageSlot id="cs-profil-piece" shape="circle" placeholder="Photo" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 20, color: 'rgb(71,29,27)' }}>Huperano</p>
                  <p style={{ margin: '6px 0 0', fontSize: 14, color: 'rgb(94,94,94)' }}>CS-0042-2026</p>
                </div>
                <button type="button" onClick={v.goPasseport} style={{ background: 'none', border: 0, padding: 0, color: 'rgb(71,29,27)', cursor: 'pointer', fontSize: 14, borderBottom: '1px solid rgb(71,29,27)' }}>Passeport numérique</button>
              </div>
              <div style={{ borderTop: '1px solid rgba(0,0,0,.15)' }}></div>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function ScCommande({ v }) {
  const o = v.orderDetail;
  return (
    <section style={{ padding: 'clamp(40px,7vw,80px) clamp(20px,5vw,140px) clamp(56px,9vw,110px)', maxWidth: 900, margin: '0 auto' }}>
      <button type="button" onClick={v.backToOrders} style={{ background: 'none', border: 0, padding: 0, color: 'rgb(94,94,94)', cursor: 'pointer', fontSize: 13, letterSpacing: '.06em' }}>← Mes commandes</button>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 20, flexWrap: 'wrap', marginTop: 22 }}>
        <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(26px,4.4vw,42px)', color: 'rgb(71,29,27)' }}>{o.no}</h1>
        <p style={{ margin: 0, fontSize: 13, letterSpacing: '.1em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>{o.statut}</p>
      </div>
      <p style={{ margin: '8px 0 0', fontSize: 14, color: 'rgb(94,94,94)' }}>Commandée le {o.date}</p>

      <div style={{ display: 'flex', gap: 0, margin: '36px 0 40px', overflow: 'hidden' }}>
        {o.steps.map((s, i) => (
          <div key={i} style={{ flex: 1, minWidth: 0 }}>
            <div style={{ height: 3, background: s.bar }}></div>
            <p style={{ margin: '12px 0 0', fontSize: 12, letterSpacing: '.08em', color: s.color }}>{s.label}</p>
          </div>
        ))}
      </div>

      <div>
        <p style={{ margin: '0 0 16px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Pièces</p>
        {o.lines.map((l, i) => (
          <div key={i} style={{ display: 'flex', gap: 18, padding: '20px 0', borderTop: '1px solid rgba(0,0,0,.15)' }}>
            <div style={{ flex: '0 0 72px', position: 'relative', width: 72, aspectRatio: '.68', overflow: 'hidden', borderRadius: '50%', outline: '1px solid rgba(0,0,0,.1)', outlineOffset: '-1px' }}>
              <ImageSlot id={l.slot} shape="circle" placeholder="Photo" />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 19, color: 'rgb(71,29,27)' }}>{l.name}</p>
              <p style={{ margin: '6px 0 0', fontSize: 14, color: 'rgb(94,94,94)' }}>{l.material} — qté {l.qty}</p>
            </div>
            <p style={{ margin: 0, fontSize: 15, whiteSpace: 'nowrap', fontVariantNumeric: 'tabular-nums' }}>{l.total}</p>
          </div>
        ))}
        <div style={{ borderTop: '1px solid rgba(0,0,0,.15)' }}></div>
      </div>

      <div style={{ marginTop: 36, display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,260px),1fr))', gap: 'clamp(24px,3vw,48px)' }}>
        <div>
          <p style={{ margin: '0 0 10px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Livraison</p>
          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7, color: 'rgb(70,70,70)' }}>{o.name}<br />{o.adresse}<br />{o.ville}</p>
        </div>
        <div>
          <p style={{ margin: '0 0 10px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Paiement</p>
          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7, color: 'rgb(70,70,70)' }}>{o.paiement}</p>
        </div>
      </div>
      {o.gift && (
        <div style={{ marginTop: 36 }}>
          <p style={{ margin: '0 0 10px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Message cadeau{o.gift.to ? ' — pour ' + o.gift.to : ''}</p>
          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7, fontStyle: 'italic', color: 'rgb(70,70,70)', overflowWrap: 'anywhere' }}>« {o.gift.message} »</p>
        </div>
      )}

      <div style={{ marginTop: 36, maxWidth: 400, marginLeft: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 15, padding: '8px 0' }}><span>Sous-total</span><span style={{ fontVariantNumeric: 'tabular-nums' }}>{o.subtotal}</span></div>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 15, padding: '8px 0', color: 'rgb(70,70,70)' }}><span>Livraison</span><span>{o.shipping}</span></div>
        <div style={{ height: 1, background: 'rgba(0,0,0,.15)', margin: '12px 0' }}></div>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 18 }}><span>Total</span><span style={{ fontVariantNumeric: 'tabular-nums' }}>{o.total}</span></div>
      </div>

      <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', marginTop: 36 }}>
        <button type="button" onClick={v.goContact} style={{ background: 'none', border: 0, padding: 0, color: 'rgb(71,29,27)', cursor: 'pointer', fontSize: 14, borderBottom: '1px solid rgb(71,29,27)' }}>Besoin d'aide sur cette commande</button>
      </div>
    </section>
  );
}

function ScLegal({ v }) {
  return (
    <section style={{ padding: 'clamp(40px,7vw,80px) clamp(20px,5vw,140px) clamp(56px,9vw,110px)', maxWidth: 900, margin: '0 auto' }}>
      <h1 style={{ margin: '0 0 26px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(28px,4.6vw,44px)', color: 'rgb(71,29,27)' }}>Informations légales</h1>
      <div style={{ display: 'flex', gap: 22, flexWrap: 'wrap', marginBottom: 34, fontSize: 13, letterSpacing: '.1em', textTransform: 'uppercase' }}>
        {v.legalTabs.map((t, i) => (
          <button key={i} type="button" onClick={t.pick} style={{ background: 'none', border: 0, padding: '0 0 6px', cursor: 'pointer', color: t.color, borderBottom: '1px solid ' + t.line, fontSize: 'inherit', letterSpacing: 'inherit', textTransform: 'inherit' }}>{t.label}</button>
        ))}
      </div>
      <h2 style={{ margin: '0 0 16px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(22px,3vw,30px)', color: 'rgb(71,29,27)' }}>{v.legalTitle}</h2>
      {v.legalBody.map((p, i) => (
        <p key={i} style={{ margin: '0 0 16px', fontSize: 16, lineHeight: 1.8, color: 'rgb(70,70,70)', textWrap: 'pretty' }}>{p.text}</p>
      ))}
      <p style={{ margin: '30px 0 0', fontSize: 13, color: 'rgb(94,94,94)' }}>Textes provisoires — à remplacer par les mentions définitives fournies par la Maison.</p>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
