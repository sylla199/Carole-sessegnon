const { useState, useEffect, useRef, Fragment } = React;

const prefersReduced = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* count-up number: tweens value -> value over ~500ms, cubic ease-out */
function AnimatedNumber({ value, format }) {
  const [, tick] = useState(0);
  const disp = useRef(value), to = useRef(value), raf = useRef(0);
  useEffect(() => {
    if (value === to.current) return;
    to.current = value;
    if (prefersReduced()) { disp.current = value; tick(x => x + 1); return; }
    const from = disp.current, t0 = performance.now(), dur = 500;
    cancelAnimationFrame(raf.current);
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      disp.current = Math.round(from + (value - from) * e); tick(x => x + 1);
      if (k < 1) raf.current = requestAnimationFrame(step);
    };
    raf.current = requestAnimationFrame(step);
  }, [value]);
  useEffect(() => () => cancelAnimationFrame(raf.current), []);
  return <span style={{ fontVariantNumeric: 'tabular-nums' }}>{format ? format(disp.current) : disp.current}</span>;
}

/* intro / loading screen: full-bleed bordeaux, CS monogram centred, fades in
   with a slight scale-up, rests, then the two panels part to reveal the home
   page. Fade/reveal only — no bounce, no spring. ~2.3s, then auto-advances. */
function IntroSeal({ onDone }) {
  const [phase, setPhase] = useState('in'); // in -> hold -> out
  useEffect(() => {
    try { sessionStorage.setItem('cs-intro', '1'); } catch (e) {}
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const t1 = setTimeout(() => setPhase('hold'), 40);
    const t2 = setTimeout(() => setPhase('out'), 1500);
    const t3 = setTimeout(() => { document.body.style.overflow = prev; onDone(); }, 2400);
    return () => { [t1, t2, t3].forEach(clearTimeout); document.body.style.overflow = prev; };
  }, []);
  const out = phase === 'out';
  const mono = {
    in: { opacity: 0, transform: 'translate(-50%,-50%) scale(.92)' },
    hold: { opacity: 0.96, transform: 'translate(-50%,-50%) scale(1)' },
    out: { opacity: 0, transform: 'translate(-50%,-50%) scale(1)' }
  }[phase];
  const panel = { position: 'absolute', top: 0, bottom: 0, width: '50.6%', background: 'rgb(71,29,27)', transition: 'transform .9s cubic-bezier(.4,0,0,1)' };
  return (
    <div aria-hidden="true" style={{ position: 'fixed', inset: 0, zIndex: 100000, pointerEvents: out ? 'none' : 'auto', overflow: 'hidden' }}>
      <div style={{ ...panel, left: 0, transform: out ? 'translateX(-100%)' : 'none' }} />
      <div style={{ ...panel, right: 0, transform: out ? 'translateX(100%)' : 'none' }} />
      <img src="assets/CS-LOGOMARK.svg" alt="" style={{
        position: 'absolute', left: '50%', top: '50%', width: 'clamp(48px,8vw,76px)', height: 'auto',
        filter: 'brightness(0) invert(1)', ...mono,
        transition: 'opacity ' + (out ? '.5s' : '.9s') + ' ease, transform ' + (out ? '.5s' : '1s') + ' cubic-bezier(.2,0,0,1)'
      }} />
    </div>
  );
}

/* ---------- inline-style-string parser: keeps DS style strings verbatim ---------- */
function st(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    let k = decl.slice(0, i).trim();
    let v = decl.slice(i + 1).trim();
    if (!k) return;
    if (k.startsWith('--')) { o[k] = v; return; }
    if (k.startsWith('-')) {
      k = k.slice(1).split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
    } else {
      k = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    }
    o[k] = v;
  });
  return o;
}

function photoFor(id) {
  if (!id) return null;
  if (PHOTOS[id]) return PHOTOS[id];
  if (id.indexOf('cs-p-') === 0) return id.slice(-4) === '-alt' ? PH.porte : PH.studio;
  if (id.indexOf('cs-cat-') === 0) return PH.terrasse;
  if (id.indexOf('cs-t') === 0) { const n = id.slice(4); return n === '1' ? PH.porte : n === '2' ? PH.coffret : PH.terrasse; }
  return null;
}

/* ============================ design-system components ============================ */
function ImageSlot({ id, shape = 'rect', placeholder = 'Image', style }) {
  const hasSize = style && (style.width || style.height);
  const box = hasSize
    ? { position: 'relative', ...style }
    : { position: 'absolute', inset: 0, width: '100%', height: '100%' };
  const src = photoFor(id);
  if (src) {
    return (
      <div style={{ ...box, overflow: 'hidden', borderRadius: shape === 'circle' ? '50%' : 0 }}>
        <img src={src} alt={placeholder} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
      </div>
    );
  }
  return (
    <div aria-label={placeholder} style={{
      ...box, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center',
      padding: 12, boxSizing: 'border-box',
      background: 'repeating-linear-gradient(45deg,rgba(71,29,27,.05),rgba(71,29,27,.05) 12px,rgba(71,29,27,.09) 12px,rgba(71,29,27,.09) 24px)',
      color: 'rgba(71,29,27,.5)', font: '500 10px/1.4 var(--font-body)', letterSpacing: '.1em',
      textTransform: 'uppercase', borderRadius: shape === 'circle' ? '50%' : 0
    }}>
      <span style={{ maxWidth: '85%' }}>{placeholder}</span>
    </div>
  );
}

function Button({ variant = 'primary', size = 'md', disabled = false, className, style, onClick, type, children }) {
  const sizes = { md: { padding: '20px 30px', font: 18 }, sm: { padding: '14px 24px', font: 16 } };
  const sz = sizes[size] || sizes.md;
  const base = {
    display: 'inline-flex', flexDirection: 'row', gap: 10, justifyContent: 'center', alignItems: 'center',
    padding: sz.padding, fontFamily: 'var(--font-body)', fontWeight: 700, fontSize: sz.font, lineHeight: '28px',
    border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', boxSizing: 'border-box',
    transition: 'background-color .15s ease, color .15s ease, opacity .15s ease', opacity: disabled ? 0.4 : 1
  };
  const variants = {
    primary: { backgroundColor: 'var(--brand-bordeaux)', color: 'var(--ink-on-dark)' },
    secondary: { backgroundColor: 'transparent', color: 'var(--brand-bordeaux)', boxShadow: 'inset 0 0 0 2px var(--brand-bordeaux)' },
    ghost: { backgroundColor: 'var(--surface-page)', color: 'var(--ink)', fontWeight: 400 },
    light: { backgroundColor: 'var(--surface-page)', color: 'var(--ink)' }
  };
  return (
    <button className={className} disabled={disabled} onClick={onClick} type={type || 'button'}
      style={{ ...base, ...variants[variant], ...style }}>
      {children ?? 'Bouton'}
    </button>
  );
}

      boxRing: s.cat === c ? 'none' : 'inset 0 0 0 1px rgb(0,0,0)',
      checkOpacity: s.cat === c ? 1 : 0
    })),
    closeFilters: () => set({ filters: false }),
    prixNum: fmt(s.fPrix).replace(' FCFA', ''),
    secCat: { open: s.secCat, rot: s.secCat ? 'rotate(180deg)' : 'none', toggle: () => setS(st => ({ ...st, secCat: !st.secCat })) },
    secDispo: { open: s.secDispo, rot: s.secDispo ? 'rotate(180deg)' : 'none', toggle: () => setS(st => ({ ...st, secDispo: !st.secDispo })) },
    secPrix: { open: s.secPrix, rot: s.secPrix ? 'rotate(180deg)' : 'none', toggle: () => setS(st => ({ ...st, secPrix: !st.secPrix })) },
    setSort: e => set({ sort: e.target.value }),
    current, addCurrent: () => addToCart(current.id, s.pqty), addTotal: current.price * s.pqty,
    accordion: ACC.map((a, i) => ({ title: a.title, body: a.body, open: s.open === i, toggle: () => setS(st => ({ ...st, open: st.open === i ? -1 : i })) })),
    lines, subtotal: fmt(sub),
    hasCart: s.cart.length > 0, cartEmpty: s.cart.length === 0,
    cartCount: s.cart.reduce((t, l) => t + l.qty, 0),
    isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3,
    step1Color: stepC(1), step2Color: stepC(2), step3Color: stepC(3),
    step1Line: stepL(1), step2Line: stepL(2), step3Line: stepL(3),
    submitLivraison: e => { e.preventDefault(); set({ step: 2 }); try { window.scrollTo(0, 0); } catch (x) {} },
    submitPaiement: e => {
      if (e && e.preventDefault) e.preventDefault();
      const no = '#CS-2026-' + String(9000 + Math.floor(Math.random() * 999));
      const date = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      const payLabel = ({ carte: 'Carte de crédit', mobile: 'Mobile money', especes: 'Paiement en espèce', paypal: 'PayPal' })[s.moyen] || 'Carte de crédit';
      const orderLines = lines.map(l => ({ slot: l.slot, name: l.name, material: l.material, qty: l.qty, total: l.total }));
      set({ step: 3, cart: [], order: { no, date, payment: payLabel, lines: orderLines, subtotal: sub, shipping: 0 } });
      try { window.scrollTo(0, 0); } catch (x) {}
    },
    backStep1: () => set({ step: 1 }),
    pIntro: s.pstep === 'intro', pSaisie: s.pstep === 'saisie', pVerif: s.pstep === 'verif',
    pShow: s.pstep === 'passeport', pDone: s.pstep === 'confirme',
    pErr: s.perr, pLocked: s.tries >= 3,
    pGoSaisie: () => set({ pstep: 'saisie', perr: '' }),
    verify: e => {
      e.preventDefault();
      const f = e.target.elements;
      const serie = (f.serie.value || '').trim().toUpperCase();
      const code = (f.code.value || '').trim().toUpperCase();
      if (s.tries >= 3) return;
      if (serie === 'CS-0042-2026' && code === '8F3K-22QD') {
        set({ pstep: 'verif', perr: '' });
        setTimeout(() => set({ pstep: 'passeport' }), 1700);
      } else {
        setS(st => {
          const tries = st.tries + 1;
          return { ...st, tries, perr: tries >= 3
            ? "Trois tentatives erronées. La saisie est bloquée pour cette session ; écrivez-nous à bonjour@carolesessegnon.com."
            : "Le numéro de série et le code d'activation ne correspondent pas. Tentative " + tries + " sur 3." };
        });
      }
    },
    passportRows: [
      { k: 'Modèle', v: 'Huperano' }, { k: 'Numéro de série', v: 'CS-0042-2026' },
      { k: 'Numérotation', v: '042 / 100' }, { k: 'Coloris', v: 'Cuir naturel & bordeaux' },
      { k: 'Matière', v: 'Cuir de vachette, tannage végétal' }, { k: 'Date de fabrication', v: '12 mars 2026' },
      { k: 'Atelier', v: 'Abidjan, Plateau' }
    ],
    pAssocDone: !!s.assoc, pAssocOpen: !s.assoc,
    assocName, assocDate: s.assoc ? s.assoc.date : '',
    associate: e => {
      e.preventDefault();
      const f = e.target.elements;
      const name = ((f.prenom.value || '') + ' ' + (f.nom.value || '')).trim();
      const date = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      set({ assoc: { name, date }, pstep: 'confirme' });
      try { window.scrollTo(0, 0); } catch (x) {}
    },
    skipAssoc: () => go('accueil'),
    pBackToPasseport: () => set({ pstep: 'passeport' }),
    pReset: () => set({ pstep: 'saisie', perr: '', tries: 0 }),
    contactSent: s.contactSent, contactOpen: !s.contactSent,
    submitContact: e => { e.preventDefault(); set({ contactSent: true }); },
    resetContact: () => set({ contactSent: false }),
    isSignup: s.authTab === 'inscription',
    authTitle: s.authTab === 'inscription' ? 'Créer un compte' : 'Bonjour',
    authCta: s.authTab === 'inscription' ? 'Créer mon compte' : 'Se connecter',
    authMsg: s.authMsg,
    tabLogin: () => set({ authTab: 'connexion', authMsg: '' }),
    tabSignup: () => set({ authTab: 'inscription', authMsg: '' }),
    tabLoginColor: s.authTab === 'connexion' ? 'rgb(71,29,27)' : 'rgb(127,127,127)',
    tabSignupColor: s.authTab === 'inscription' ? 'rgb(71,29,27)' : 'rgb(127,127,127)',
    tabLoginLine: s.authTab === 'connexion' ? 'rgb(71,29,27)' : 'transparent',
    tabSignupLine: s.authTab === 'inscription' ? 'rgb(71,29,27)' : 'transparent',
    submitAuth: e => { e.preventDefault(); set({ authMsg: "Démonstration — aucun compte n'est réellement créé." }); },
    noopAuth: () => set({ authMsg: 'Démonstration — connexion tierce non branchée.' }),
    legalTabs: [{ key: 'mentions', label: 'Mentions légales' }, { key: 'cgv', label: 'CGV' }, { key: 'rgpd', label: 'Confidentialité' }].map(t => ({
      label: t.label, pick: () => set({ legal: t.key }),
      color: s.legal === t.key ? 'rgb(71,29,27)' : 'rgb(127,127,127)',
      line: s.legal === t.key ? 'rgb(71,29,27)' : 'transparent'
    })),
    legalTitle: LEGAL[legalKey].title,
    legalBody: LEGAL[legalKey].body.map(t => ({ text: t }))
  };

  return (
    <Fragment>
      {showIntro && <IntroSeal onDone={() => setShowIntro(false)} />}
      <Shell v={v} />
    </Fragment>
  );
}

function ScPieces({ v }) {
  const [stuck, setStuck] = useState(false);
  const [vw, setVw] = useState(() => (typeof document !== 'undefined' && document.documentElement ? document.documentElement.clientWidth : 0));
  const sentinel = useRef(null);
  useEffect(() => {
    const onR = () => setVw(document.documentElement.clientWidth);
    onR();
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  useEffect(() => {
    const el = sentinel.current;
    if (!el || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(([e]) => setStuck(!e.isIntersecting), { rootMargin: '-' + (v.s.headerH + 1) + 'px 0px 0px 0px', threshold: [0, 1] });
    io.observe(el);
    return () => io.disconnect();
  }, [v.s.headerH]);
  return (
    <section style={{ padding: 'clamp(40px,7vw,80px) clamp(20px,5vw,140px) clamp(56px,9vw,110px)', maxWidth: 1640, margin: '0 auto' }}>
      <p style={{ margin: '0 0 8px', fontSize: 14, letterSpacing: '.1em', color: 'rgb(94,94,94)' }}>Les Pièces</p>
      <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(32px,6vw,60px)', lineHeight: 1.06, letterSpacing: '-.02em', color: 'rgb(71,29,27)' }}>Les Pièces</h1>
      <div ref={sentinel} aria-hidden="true" style={{ height: 1, margin: '26px 0 0', pointerEvents: 'none' }} />
      <div style={{ position: 'sticky', top: v.headerH, zIndex: 20, padding: '14px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
        <div aria-hidden="true" style={{ position: 'absolute', top: 0, bottom: 0, left: '50%', width: (vw || 0) + 'px', transform: 'translateX(-50%)', background: 'rgba(255,255,255,.72)', backdropFilter: 'blur(40px)', WebkitBackdropFilter: 'blur(40px)', borderBottom: '1px solid rgba(0,0,0,.06)', opacity: stuck ? 1 : 0, transition: 'opacity .25s cubic-bezier(.2,0,0,1)', pointerEvents: 'none' }} />
        <p style={{ position: 'relative', margin: 0, fontSize: 15, color: 'rgb(70,70,70)' }}>Type de pièce : <span style={{ color: 'rgb(0,0,0)' }}>{v.catLabel}</span></p>
        <button type="button" onClick={v.toggleFilters} style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 10, background: 'none', border: 0, borderBottom: '1px solid rgb(0,0,0)', padding: '0 0 5px', color: 'rgb(0,0,0)', cursor: 'pointer', fontSize: 15 }}>
          Filtrer
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" strokeWidth="1"><path d="M0 1h16M3 6h10M6 11h4" /></svg>
        </button>
      </div>

      {v.filters && (
        <Fragment>
          <div onClick={v.closeFilters} style={{ position: 'fixed', inset: 0, zIndex: 70, background: 'rgba(0,0,0,.35)', animation: 'cs-in .2s ease-out' }}></div>
          <aside style={{ position: 'fixed', top: 10, right: 10, bottom: 10, zIndex: 71, width: 'min(556px,calc(100vw - 20px))', background: 'rgb(255,255,255)', padding: '21px 20px 20px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: 24, overflow: 'auto', animation: 'cs-slide .28s ease-out' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 31, alignItems: 'stretch' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, height: 39 }}>
                <span style={{ fontSize: 18, lineHeight: '28px', color: 'rgb(0,0,0)' }}>Filter par :</span>
                <button type="button" aria-label="Fermer" onClick={v.closeFilters} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 39, height: 39, background: 'rgb(228,228,228)', border: 0, cursor: 'pointer', color: 'rgb(0,0,0)', padding: 0 }}>
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" strokeWidth="1"><path d="M3.7 3.7l7.6 7.6M11.3 3.7l-7.6 7.6" /></svg>
                </button>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'stretch' }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'stretch' }}>

                      {v.mobileOpen && <span style={{ position: 'absolute', left: 4, top: 4, width: 8, height: 8, borderRadius: '50%', background: 'rgb(71,29,27)' }}></span>}
                    </span>
                    <span style={{ fontSize: 16, color: 'rgb(0,0,0)' }}>Mobile money</span>
                  </button>
                  {v.mobileOpen && (
                    <label style={{ ...st(LABEL), marginTop: 16, display: 'block' }}>Numéro mobile money<input name="mm" inputMode="tel" placeholder="+225 07 00 00 00 00" style={st(INPUT.replace('--color-secondary-50', 'rgb(174,174,174)'))} /></label>

                <div style={{ boxShadow: v.especesRing, padding: 20 }}>

                    <span style={{ flex: '0 0 auto', position: 'relative', width: 16, height: 16, borderRadius: '50%', boxShadow: v.especesDot }}>

                    <span style={{ fontSize: 16, color: 'rgb(0,0,0)' }}>Paiement en espèce</span>
                  </button>
                  {v.especesOpen && <p style={{ margin: '16px 0 0', fontSize: 14, lineHeight: 1.6, color: 'rgb(94,94,94)' }}>Le montant sera à régler en espèces à la réception de votre commande.</p>}

            </div>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginTop: 26 }}>
              <Button variant="secondary" onClick={v.backStep1} style={v.backBtn.style}>

              </Button>
              <Button variant="primary" onClick={v.submitPaiement} style={v.confirmBtn.style}>Confirmer et passer au paiement</Button>
            </div>
            <p style={{ margin: '18px 0 0', fontSize: 13, color: 'rgb(94,94,94)' }}>Connexion chiffrée (HTTPS). Aucune donnée bancaire n'est conservée par la Maison.</p>
          </div>
          <div style={{ background: 'rgb(255,251,248)', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.08)', padding: 'clamp(20px,3vw,32px)' }}>
            <p style={{ margin: '0 0 20px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Votre commande</p>
            {v.lines.map((l, i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 15, padding: '8px 0' }}><span>{l.label}</span><span style={{ fontVariantNumeric: 'tabular-nums' }}>{l.total}</span></div>
            ))}
            <div style={{ height: 1, background: 'rgba(0,0,0,.15)', margin: '14px 0' }}></div>
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 18 }}><span>Total</span><span style={{ fontVariantNumeric: 'tabular-nums' }}>{v.subtotal}</span></div>
          </div>
        </form>
      )}

      {v.isStep3 && (
        <div style={{ maxWidth: 900, animation: 'cs-in .4s ease-out' }}>
          <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'rgb(71,29,27)', color: 'rgb(255,255,255)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 28 }}>
            <svg width="24" height="18" viewBox="0 0 22 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M1 8.5 7.5 15 21 1.5" /></svg>
          </div>
          <h2 style={{ margin: '0 0 30px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(26px,4vw,40px)', color: 'rgb(71,29,27)' }}>Votre commande a été confirmée !</h2>
          <div style={{ display: 'flex', gap: 'clamp(32px,6vw,80px)', flexWrap: 'wrap', padding: '22px 0', borderTop: '1px solid rgba(0,0,0,.15)', borderBottom: '1px solid rgba(0,0,0,.15)', marginBottom: 32 }}>
            <div>
              <p style={{ margin: '0 0 6px', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Numéro de commande</p>
              <p style={{ margin: 0, fontSize: 16, color: 'rgb(0,0,0)' }}>{v.orderNo}</p>
            </div>
            <div>
              <p style={{ margin: '0 0 6px', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Date de commande</p>
              <p style={{ margin: 0, fontSize: 16, color: 'rgb(0,0,0)' }}>{v.orderDate}</p>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,260px),1fr))', gap: 'clamp(24px,3vw,48px)', marginBottom: 36 }}>
            <div style={{ background: 'rgb(255,251,248)', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.08)', padding: 22 }}>
              <p style={{ margin: '0 0 12px', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Adresse de livraison</p>
              <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7, color: 'rgb(70,70,70)' }}>{v.orderMode}</p>
            </div>
            <div style={{ background: 'rgb(255,251,248)', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.08)', padding: 22 }}>
              <p style={{ margin: '0 0 12px', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Mode de paiement</p>
              <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7, color: 'rgb(70,70,70)' }}>{v.paymentLabel}</p>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap' }}>
            <Button variant="primary" onClick={v.goPieces} style={v.btnUpper.style}>Continuer mes achats</Button>
            <Button variant="secondary" onClick={v.suivreCommande} style={v.btnUpper.style}>Suivre ma commande</Button>
          </div>
        </div>
      )}
    </section>
  );
}

function ScPasseport({ v }) {
  return (
    <section style={{ padding: 'clamp(40px,7vw,80px) clamp(20px,5vw,140px) clamp(56px,9vw,110px)', maxWidth: 900, margin: '0 auto' }}>
      {v.pIntro && (
        <div>

          <h1 style={{ margin: '0 0 18px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(30px,5vw,52px)', lineHeight: 1.08, color: 'rgb(71,29,27)' }}>Le registre de la Maison</h1>
          <p style={{ margin: '0 0 30px', fontSize: 17, lineHeight: 1.7, color: 'rgb(70,70,70)', maxWidth: '60ch', textWrap: 'pretty' }}>Chaque pièce est numérotée et accompagnée, dans son coffret, d'un certificat d'origine. Scannez le QR code du certificat, ou saisissez directement votre numéro de série et votre code d'activation privé.</p>
          <div style={{ display: 'flex', gap: 'clamp(20px,3vw,40px)', flexWrap: 'wrap', alignItems: 'center', padding: 'clamp(20px,3vw,32px)', background: 'rgb(255,251,248)', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.08)' }}>
            <div style={{ flex: '0 0 auto', width: 132 }}>
              <ImageSlot id="cs-sentinelle-accueil" placeholder="Sentinelle 1 — illustration à venir" style={{ width: 132, height: 172 }} />
              <p style={{ margin: '8px 0 0', fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: 'rgb(94,94,94)', textAlign: 'center' }}>Emplacement Sentinelle</p>
            </div>
            <p style={{ flex: 1, minWidth: 220, margin: 0, fontFamily: 'var(--font-display)', fontSize: 'clamp(18px,2.4vw,24px)', lineHeight: 1.5, color: 'rgb(71,29,27)', textWrap: 'pretty' }}>Les Sentinelles veillent sur chaque pièce, du registre à la vérification de son authenticité.</p>
          </div>
          <Button variant="primary" onClick={v.pGoSaisie} style={{ ...v.btnUpper.style, marginTop: 30 }}>Vérifier ma pièce</Button>
        </div>
      )}

      {v.pSaisie && (
        <div>
          <p style={{ margin: '0 0 8px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Étape 1 sur 3</p>
          <h1 style={{ margin: '0 0 14px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(26px,4.4vw,44px)', lineHeight: 1.1, color: 'rgb(71,29,27)' }}>Votre certificat</h1>
          <p style={{ margin: '0 0 30px', fontSize: 16, lineHeight: 1.7, color: 'rgb(70,70,70)', maxWidth: '56ch' }}>Les deux informations figurent sur le certificat d'origine placé dans votre coffret.</p>
          <form onSubmit={v.verify} style={{ maxWidth: 460, display: 'flex', flexDirection: 'column', gap: 20 }}>
            <label style={st(LABEL)}>Numéro de série<input name="serie" required placeholder="CS-0042-2026" style={st(INPUT + ';letter-spacing:.08em')} /></label>
            <label style={st(LABEL)}>Code d'activation privé<input name="code" required placeholder="8F3K-22QD" style={st(INPUT + ';letter-spacing:.08em')} /></label>
            {v.pErr && <p style={{ margin: 0, padding: 14, background: 'rgb(254,247,246)', boxShadow: 'inset 0 0 0 1px rgb(253,83,83)', fontSize: 14, lineHeight: 1.6, color: 'rgb(155,24,33)' }}>{v.pErr}</p>}
            <Button type="submit" variant="primary" disabled={v.pLocked} style={v.btnBlock.style}>Vérifier</Button>
            <p style={{ margin: 0, fontSize: 13, lineHeight: 1.6, color: 'rgb(94,94,94)' }}>Démonstration : numéro <span style={{ color: 'rgb(0,0,0)' }}>CS-0042-2026</span>, code <span style={{ color: 'rgb(0,0,0)' }}>8F3K-22QD</span>. Trois tentatives erronées bloquent la saisie.</p>
          </form>
        </div>
      )}

      {v.pVerif && (
        <div style={{ padding: 'clamp(40px,10vw,90px) 0', textAlign: 'center' }}>
          <div style={{ width: 44, height: 44, margin: '0 auto 28px', border: '1px solid rgba(71,29,27,.2)', borderTopColor: 'rgb(71,29,27)', borderRadius: '50%', animation: 'cs-spin 1s linear infinite' }}></div>
          <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 'clamp(20px,3vw,28px)', color: 'rgb(71,29,27)' }}>Vérification au registre</p>
          <p style={{ margin: '12px 0 0', fontSize: 15, color: 'rgb(94,94,94)' }}>Un instant, les Sentinelles consultent les archives.</p>
          <div style={{ margin: '34px auto 0', width: 120 }}>
            <ImageSlot id="cs-sentinelle-verif" placeholder="Sentinelle 2 — illustration à venir" style={{ width: 120, height: 156 }} />
          </div>
        </div>
      )}

      {v.pShow && (
        <div style={{ animation: 'cs-in .4s ease-out' }}>
          <p style={{ margin: '0 0 8px', fontSize: 12, letterSpacing: '.18em', textTransform: 'uppercase', color: 'rgb(94,94,94)' }}>Étape 2 sur 3 — pièce authentifiée</p>
          <h1 style={{ margin: '0 0 26px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(28px,4.6vw,48px)', lineHeight: 1.08, color: 'rgb(71,29,27)' }}>Passeport de la pièce</h1>
          <div style={{ background: 'rgb(255,255,255)', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.12)', padding: 'clamp(20px,3.5vw,40px)', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,240px),1fr))', gap: 'clamp(24px,3vw,44px)', alignItems: 'start' }}>

                  <span style={{ color: 'rgb(94,94,94)' }}>{r.k}</span>

                    <option>Côte d'Ivoire</option><option>France</option><option>Sénégal</option><option>Autre</option>
                  </select>

                <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', fontSize: 14, lineHeight: 1.6, color: 'rgb(70,70,70)', cursor: 'pointer' }}>
                  <input type="checkbox" name="rgpd" required style={{ marginTop: 4, accentColor: 'rgb(71,29,27)' }} />
                  <span>J'accepte que la Maison conserve ces informations pour rattacher la pièce à mon nom, conformément à la politique de confidentialité.</span>

                <div style={{ display: 'flex', gap: 18, alignItems: 'center', flexWrap: 'wrap', marginTop: 6 }}>
                  <Button type="submit" variant="primary" style={v.btnUpper.style}>Associer la pièce</Button>

      <h2 style={{ margin: '0 0 16px', fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 'clamp(22px,3vw,30px)', color: 'rgb(71,29,27)' }}>{v.legalTitle}</h2>
      {v.legalBody.map((p, i) => (
        <p key={i} style={{ margin: '0 0 16px', fontSize: 16, lineHeight: 1.8, color: 'rgb(70,70,70)', textWrap: 'pretty' }}>{p.text}</p>
      ))}
      <p style={{ margin: '30px 0 0', fontSize: 13, color: 'rgb(94,94,94)' }}>Textes provisoires — à remplacer par les mentions définitives fournies par la Maison.</p>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
